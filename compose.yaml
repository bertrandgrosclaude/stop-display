services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_target:/app/target
      - backend_maven_cache:/root/.m2

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:8080
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_maven_cache:
  backend_target:
  frontend_node_modules:
